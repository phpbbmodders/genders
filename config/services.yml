imports:
    - {resource: gender_constants.yml}

services:
    rmcgirr83.genders.listener:
        class: rmcgirr83\genders\event\listener
        arguments:
            - '@language'
            - '@request'
            - '@template'
            - '@user'
            - '@rmcgirr83.genders.core.genders'
        tags:
            - { name: event.listener }

    rmcgirr83.genders.core.genders:
        class: rmcgirr83\genders\core\genders
        arguments:
            - '@config'
            - '@language'
            - '%gender_constants%'
